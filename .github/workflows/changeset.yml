name: changeset
# merge_group: the merge queue needs this required check to report; a queued PR was checked when it was open, so the job is skipped there.
# workflow_dispatch: release.yml starts it on changeset-release/main when it had to open the PR with GITHUB_TOKEN.
on: { pull_request: {}, merge_group: {}, workflow_dispatch: {} }
jobs:
  status:
    # the bot's Version Packages PR consumes the changesets, so it has none to show
    if: github.event_name != 'merge_group' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # changeset status diffs against origin/main
      # node_modules comes from the cache the ci workflow fills (same lockfile key), so this job rarely runs npm ci
      - uses: ./.github/actions/deps
      - name: the PR carries a changeset
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/main
      - name: the Version Packages branch consumed every changeset
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF_NAME" = changeset-release/main ] || { echo "dispatch only on changeset-release/main" >&2; exit 1; }
          left="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)"
          [ -z "$left" ] || { echo "unconsumed changesets: $left" >&2; exit 1; }
