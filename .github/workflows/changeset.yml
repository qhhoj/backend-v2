name: changeset
# workflow_dispatch: release.yml starts it on changeset-release/main (a PR opened with GITHUB_TOKEN triggers nothing).
on: { pull_request: {}, workflow_dispatch: {} }
jobs:
  status:
    # the bot's Version Packages PR consumes the changesets, so it has none to show
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # changeset status diffs against origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: the PR carries a changeset
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/main
      - name: the Version Packages branch consumed every changeset
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF_NAME" = changeset-release/main ] || { echo "dispatch only on changeset-release/main" >&2; exit 1; }
          left="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)"
          [ -z "$left" ] || { echo "unconsumed changesets: $left" >&2; exit 1; }
