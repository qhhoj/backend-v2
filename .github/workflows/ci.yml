# workflow_dispatch: release.yml starts it on changeset-release/main (a PR opened with GITHUB_TOKEN triggers nothing).
name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
# The test job runs the unit specs (jest.config.js) and the static OpenAPI specs; the db job runs the specs that need
# MongoDB and Redis (*.db.spec.ts, *.e2e-spec.ts; CONTRIBUTING.md, Testing).
jobs:
  # Pushes that touch only docs, changesets or deploy scripts skip the heavy jobs below; a skipped job counts as a
  # pass, so the run (and the deploy gate waiting on it) stays green. deploy-scripts always runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs: { code: '${{ steps.diff.outputs.code }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_LIGHT_PATHS: '^(.*[.]md|docs/.*|[.]changeset/.*|deploy/.*)$'
          CI_HEAVY_PATHS: '^deploy/container/'
        run: bash deploy/ci/code-changed.sh "$BASE" >> "$GITHUB_OUTPUT"
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The vendored judge-v2 proto matches proto.lock.json and the committed TypeScript is current.
      - run: npm run judge-proto:check
      - run: npm run build && npx nest build worker && npx nest build bridge
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      - run: npm ci
      # Official static build: the Debian/Ubuntu pandoc fails to start threads under the worker's `prlimit --as=768MiB` cap.
      - name: Install pandoc 3.1.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.tar.gz" https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz
          echo "74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.1.3/bin" >> "$GITHUB_PATH"
      - run: pandoc --version
      # --forceExit: one leaked handle must not hang the job until the timeout.
      - run: npm run test:unit -- --forceExit
  db:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      # Some specs use Redis db numbers above 15, so the server needs more than the default 16 databases.
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7 redis-server --databases 100 --save '' --appendonly no
          for _ in $(seq 30); do docker exec redis redis-cli ping | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - id: mms
        run: echo "version=$(node -p "require('mongodb-memory-server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binaries-${{ runner.os }}-${{ steps.mms.outputs.version }}
      # --forceExit: jest hangs at exit on leaked handles. Two workers: each has its own Redis db and Mongo databases.
      - run: npx jest --config test/jest/db.config.js --forceExit --maxWorkers=2
        env: { TEST_REDIS_URL: 'redis://localhost:6379/60' }
  openapi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      # The swagger CLI plugin does not run under plain jest, so the OpenAPI specs have their own config. Static: the
      # document comes from stubbed controllers (the specs that boot the app are local, npm run test:openapi:db).
      - run: npm run test:openapi -- --forceExit
      - run: npm run openapi:emit
      - name: openapi.json is up to date
        run: |
          if ! git diff --exit-code --quiet -- openapi.json; then
            git diff --stat -- openapi.json
            git diff -- openapi.json | head -200
            echo "openapi.json is stale: run npm run openapi:emit and commit it"
            exit 1
          fi
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -f Containerfile -t qhhoj-backend:ci .
      # Static checks only; booting api and worker against Mongo and Redis is local: bash deploy/container/smoke.sh <image>.
      - run: bash deploy/container/smoke.sh --static qhhoj-backend:ci
  deploy-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # restic: the backup and pull tests run the scripts against real (temp-dir) repositories; rsync ships rrsync.
      - run: sudo apt-get install -y shellcheck restic rsync
      - run: shellcheck -S warning deploy/qhhoj-deploy deploy/install-host.sh deploy/*.test.sh deploy/ci/*.sh deploy/judge/*.sh deploy/container/*.sh deploy/quadlet/*.sh deploy/backup/qhhoj-backup deploy/backup/*.sh deploy/backup/pull/qhhoj-pull deploy/backup/pull/qhhoj-pull-serve deploy/backup/pull/*.sh
      - name: Run script tests
        run: |
          shopt -s nullglob
          for t in deploy/*.test.sh deploy/*/*.test.sh deploy/*/*/*.test.sh; do echo "== $t"; bash "$t"; done
  # The required check (with changes): it fails when any job above failed or was cancelled; a skipped job passes.
  ci-ok:
    if: always()
    needs: [changes, checks, test, db, openapi, image, deploy-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env: { RESULTS: '${{ join(needs.*.result, '' '') }}' }
        run: |
          echo "$RESULTS"
          ! grep -qE 'failure|cancelled' <<< "$RESULTS"
