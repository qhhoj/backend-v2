name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-retries 10 --health-start-period 30s
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    env:
      TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-8.0.4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Official static build: the Debian/Ubuntu pandoc fails to start threads under the worker's `prlimit --as=768MiB` cap.
      - name: Install pandoc 3.1.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.tar.gz" https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz
          echo "74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.1.3/bin" >> "$GITHUB_PATH"
      - run: pandoc --version
      - run: npm run lint
      - run: npm run typecheck
      # The vendored judge-v2 proto matches proto.lock.json and the committed TypeScript is current.
      - run: npm run judge-proto:check
      # --forceExit: one leaked handle must not hang the job until the timeout.
      - run: npm test -- --forceExit
      # The swagger CLI plugin does not run under plain jest, so the OpenAPI spec has its own config.
      - run: npm run test:openapi -- --forceExit
      - run: npm run build && npx nest build migrator && npx nest build worker && npx nest build bridge
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run openapi:emit
      - name: openapi.json is up to date
        run: |
          if ! git diff --exit-code --quiet -- openapi.json; then
            git diff --stat -- openapi.json
            git diff -- openapi.json | head -200
            echo "openapi.json is stale: run npm run openapi:emit and commit it"
            exit 1
          fi
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mongo (rs0) and Redis
        run: |
          docker run -d --name mongo --network host mongo:8 --replSet rs0 --bind_ip 127.0.0.1
          docker run -d --name redis --network host redis:7
          for _ in $(seq 30); do docker exec mongo mongosh --quiet --eval 'rs.initiate().ok || rs.status().ok' && break; sleep 2; done
      - run: docker build -f Containerfile -t qhhoj-backend:ci .
      - run: bash deploy/container/smoke.sh qhhoj-backend:ci
  deploy-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning deploy/qhhoj-deploy deploy/migrate/qhhoj-migrate deploy/install-host.sh deploy/*.test.sh deploy/ci/*.sh deploy/judge/*.sh deploy/container/*.sh deploy/quadlet/*.sh
      - name: Run script tests
        run: |
          shopt -s nullglob
          for t in deploy/*.test.sh deploy/*/*.test.sh; do echo "== $t"; bash "$t"; done
