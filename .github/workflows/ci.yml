# merge_group: the merge queue runs the same checks on the queued merge commit (its base is merge_group.base_sha).
# workflow_dispatch: release.yml starts it on changeset-release/main when it had to open the PR with GITHUB_TOKEN.
name: ci
on: { push: { branches: [main] }, pull_request: {}, merge_group: {}, workflow_dispatch: {} }
# The test job runs the unit specs (jest.config.js) and the static OpenAPI specs. No job starts MongoDB or Redis: the
# specs that need them (*.db.spec.ts, *.e2e-spec.ts; CONTRIBUTING.md, Testing) run locally before a PR and nightly on
# origin/main (.batch/nightly/run.sh). The image job builds on pushes to main and on PRs that change what the image is made of.
# Third-party actions are pinned by commit SHA (the comment names the tag). .github/actions/deps installs Node and the
# cached node_modules; on a cache miss it runs `npm ci --ignore-scripts` (no dependency's install script runs) and
# rebuilds by name the two native modules the jobs need (dolos-parsers for the similarity specs, grpc-tools' protoc for
# judge-proto:check).
jobs:
  # Pushes that touch only docs, changesets or deploy scripts skip the heavy jobs below; a skipped job counts as a
  # pass, so the run (and the deploy gate waiting on it) stays green. deploy-scripts always runs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: '${{ steps.diff.outputs.code }}'
      deploy: '${{ steps.image.outputs.deploy }}'
      lint_files: '${{ steps.lint.outputs.lint_files }}'
      image: '${{ steps.image.outputs.image }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
          CI_LIGHT_PATHS: '^(.*[.]md|docs/.*|[.]changeset/.*|deploy/.*)$'
          CI_HEAVY_PATHS: '^deploy/container/'
        # A manual run (the Version Packages branch) compares with main: its changes are what the branch adds.
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then BASE="$(git merge-base origin/main HEAD)"; fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          # A version-packages change (changesets, changelog, version fields) has no code to test.
          if bash deploy/ci/version-only.sh "$BASE" HEAD 2>/dev/null; then echo code=false >> "$GITHUB_OUTPUT"
          else bash deploy/ci/code-changed.sh "$BASE" >> "$GITHUB_OUTPUT"; fi
      # The image is what Containerfile, the dependencies, the entrypoint and the app entry points make of the code.
      # deploy-scripts checks deploy/, scripts/judge/ and the workflows. Pushes and manual runs always run both jobs;
      # a PR or a merge-queue run runs one only when its inputs changed.
      - id: image
        run: |
          changed() { git diff --name-only "$BASE" HEAD | grep -qE "$1"; }
          if [ '${{ github.event_name }}' != pull_request ] && [ '${{ github.event_name }}' != merge_group ] \
            || changed '^(Containerfile|package(-lock)?[.]json|nest-cli[.]json|deploy/container/|\.github/workflows/|apps/[^/]+/src/main[.]ts)'; then
            echo image=true >> "$GITHUB_OUTPUT"
          else echo image=false >> "$GITHUB_OUTPUT"; fi
          if [ '${{ github.event_name }}' != pull_request ] && [ '${{ github.event_name }}' != merge_group ] \
            || changed '^(deploy/|scripts/judge/|\.github/)'; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else echo deploy=false >> "$GITHUB_OUTPUT"; fi
      # A PR or a merge-queue run lints only the changed TypeScript files; pushes to main and manual runs lint all.
      - id: lint
        run: |
          if [ '${{ github.event_name }}' = pull_request ] || [ '${{ github.event_name }}' = merge_group ]; then
            files="$(git diff --name-only --diff-filter=d "$BASE" HEAD | grep -E '^(apps|libs)/.*[.]ts$' | paste -sd' ' || true)"
            echo "lint_files=${files:-none}" >> "$GITHUB_OUTPUT"
          else echo lint_files=all >> "$GITHUB_OUTPUT"; fi
  # lint, type check and the build run side by side: each is on the PR's critical path
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deps
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      # PR and merge queue: the changed files only (lint_files, changes job); eslint also runs prettier on them.
      - name: Lint
        env: { LINT_FILES: '${{ needs.changes.outputs.lint_files }}' }
        run: |
          if [ "$LINT_FILES" = all ]; then npm run lint
          elif [ "$LINT_FILES" != none ]; then npx eslint --no-warn-ignored $LINT_FILES
          fi
      # No plan, task or preflight ids in source comments.
      - run: bash scripts/lint/check-plan-ids.sh
      - run: npm run typecheck
      # The vendored judge-v2 proto matches proto.lock.json and the committed TypeScript is current.
      - run: npm run judge-proto:check
  # The three apps build side by side (webpack each); a failing app fails the job.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { app: [api, worker, bridge] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deps
      - run: npx nest build ${{ matrix.app }}
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deps
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      # Official static build: the Debian/Ubuntu pandoc fails to start threads under the worker's `prlimit --as=768MiB` cap.
      - name: Install pandoc 3.1.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.tar.gz" https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz
          echo "74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.1.3/bin" >> "$GITHUB_PATH"
      - run: pandoc --version
      # --forceExit: one leaked handle must not hang the job until the timeout.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jest
          key: jest-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: jest-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run test:unit -- --forceExit --cacheDirectory=${{ runner.temp }}/jest
  # The OpenAPI specs and the openapi.json check run side by side (each is a ts-jest run with the swagger plugin).
  openapi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { check: [specs, document] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/deps
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/jest
          key: jest-openapi-${{ matrix.check }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: jest-openapi-${{ matrix.check }}-${{ hashFiles('package-lock.json') }}-
      # The swagger CLI plugin does not run under plain jest, so the OpenAPI specs have their own config. Static: the
      # document comes from stubbed controllers (the specs that boot the app are local, npm run test:openapi:db).
      - if: matrix.check == 'specs'
        run: npm run test:openapi -- --forceExit --cacheDirectory=${{ runner.temp }}/jest
      - if: matrix.check == 'document'
        run: npm run openapi:emit -- --cacheDirectory=${{ runner.temp }}/jest
      - name: openapi.json is up to date
        if: matrix.check == 'document'
        run: |
          if ! git diff --exit-code --quiet -- openapi.json; then
            git diff --stat -- openapi.json
            git diff -- openapi.json | head -200
            echo "openapi.json is stale: run npm run openapi:emit and commit it"
            exit 1
          fi
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Layer cache in the GitHub cache: npm ci, the native rebuild and the Playwright install are reused while their inputs hold.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: qhhoj-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Static checks only; booting api and worker against Mongo and Redis is local: bash deploy/container/smoke.sh <image>.
      - run: bash deploy/container/smoke.sh --static qhhoj-backend:ci
  deploy-scripts:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # restic: the backup and pull tests run the scripts against real (temp-dir) repositories; rsync ships rrsync.
      - run: sudo apt-get install -y shellcheck restic rsync
      - run: shellcheck -S warning deploy/qhhoj-deploy deploy/qhhoj-deploy-serve deploy/install-host.sh deploy/nginx/*.sh deploy/*.test.sh deploy/ci/*.sh deploy/judge/*.sh deploy/container/*.sh deploy/quadlet/*.sh deploy/backup/qhhoj-backup deploy/backup/*.sh deploy/backup/pull/qhhoj-pull deploy/backup/pull/qhhoj-pull-serve deploy/backup/pull/*.sh
      - name: Run script tests
        # Four at a time (each test makes its own temp dirs); one test (backup) takes two minutes, so the rest finish inside it.
        run: |
          shopt -s nullglob
          printf '%s\n' deploy/*.test.sh deploy/*/*.test.sh deploy/*/*/*.test.sh | xargs -P 4 -I{} bash -c 'echo "== {}"; bash "{}" 2>&1 || { echo "FAILED {}"; exit 1; }'
      # deploy/judge copies equal judge-v2's packaging/ at the ref in deploy/judge/judge-release (a tag or a commit SHA).
      - id: judge
        run: echo "ref=$(cat deploy/judge/judge-release)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: qhhoj/judge-v2
          ref: ${{ steps.judge.outputs.ref }}
          path: judge-v2
          sparse-checkout: packaging
      - run: bash scripts/judge/check-deploy-copies.sh judge-v2
  # The required check (with changes). Fails when any job failed or was cancelled. When the change has code, the jobs that
  # must run (static, build, test, openapi, and image when selected; deploy-scripts when deploy/, scripts/judge/ or a workflow changed) must have succeeded: a skipped one is a failure.
  ci-ok:
    if: always()
    needs: [changes, static, build, test, openapi, image, deploy-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: '${{ join(needs.*.result, '' '') }}'
          CODE: ${{ needs.changes.outputs.code }}
          IMAGE: ${{ needs.changes.outputs.image }}
          MUST: '${{ needs.changes.result }}'
          DEPLOY: ${{ needs.changes.outputs.deploy }}
          DEPLOY_JOB: ${{ needs.deploy-scripts.result }}
          CODE_JOBS: '${{ needs.static.result }} ${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.openapi.result }}'
          IMAGE_JOB: ${{ needs.image.result }}
        run: |
          echo "$RESULTS"
          # `! cmd` never trips bash -e, so each check exits explicitly
          ! grep -qE 'failure|cancelled' <<< "$RESULTS" || exit 1
          ! grep -qvE '^(success )*success$' <<< "$MUST" || exit 1
          [ "$DEPLOY" != true ] || [ "$DEPLOY_JOB" = success ] || exit 1
          if [ "$CODE" = true ]; then
            ! grep -qvE '^(success )*success$' <<< "$CODE_JOBS" || exit 1
            [ "$IMAGE" != true ] || [ "$IMAGE_JOB" = success ] || exit 1
          fi
