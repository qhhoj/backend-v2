name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-retries 10 --health-start-period 30s
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    env:
      TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-8.0.4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y pandoc && pandoc --version
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npx nest build migrator && npx nest build worker
