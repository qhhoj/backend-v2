# QHHOJ v2 site. Install as /etc/nginx/conf.d/qhhoj.conf (http context) plus nginx/security-headers.conf
# next to it as /etc/nginx/snippets/qhhoj-security-headers.conf. Adjust the paths marked CHANGE.
# nginx is the edge: the api listens on 127.0.0.1 (LISTEN_HOST; keep PORT firewalled too) and TRUST_PROXY=loopback.
# The judge bridge (TCP 9999) is not proxied here and must be firewalled to judge hosts only.

upstream qhhoj_api {
    server 127.0.0.1:3000;     # PORT in the env file
    keepalive 16;
}

# PDFs open in the browser's viewer, which refuses sandboxed documents; an empty add_header value is not sent.
map $uri $qhhoj_media_csp {
    ~*\.pdf$  "";
    default   "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox";
}

server {
    listen 80;
    listen [::]:80;
    server_name oj.example.org;          # CHANGE: SITE_URL host
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;      # nginx >= 1.25.1: add `http2 on;`; older: `listen 443 ssl http2;`
    listen [::]:443 ssl;
    server_name oj.example.org;          # CHANGE

    ssl_certificate     /etc/letsencrypt/live/oj.example.org/fullchain.pem;   # CHANGE
    ssl_certificate_key /etc/letsencrypt/live/oj.example.org/privkey.pem;     # CHANGE
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/qhhoj-security-headers.conf;
    server_tokens off;
    # Empty except during the pre-go-live review (`qhhoj-migrate preview on`): basic auth, loopback exempt.
    include /etc/nginx/snippets/qhhoj-gate.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               text/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;
    # text/event-stream is deliberately not compressed.


    # Default body cap: JSON bodies are <= 8 MiB (DATA_BODY_LIMIT_BYTES), multipart uploads
    # <= 20 MiB (MAX_UPLOAD_BYTES). Only the two archive routes below accept 512 MiB.
    client_max_body_size 21m;

    root /var/www/qhhoj/current;         # qhhoj-deploy flips this symlink to releases/<version>

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://qhhoj_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;                       # cookie Origin check compares with SITE_URL
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;     # never trust a client-supplied id
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;     # overwrite: nginx is the first trusted hop
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Short links: relative 302 with Cache-Control: no-store from the api.
    location /s/ {
        proxy_pass http://qhhoj_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;     # never trust a client-supplied id
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sync API for integration clients (qhi_ bearer keys): the real client address must reach the api
    # (TRUST_PROXY) because each key's allowedCidrs and the failed-key lockout use it.
    location /api/sync/ {
        proxy_pass http://qhhoj_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;     # never trust a client-supplied id
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;     # overwrite: nginx is the first trusted hop
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live event streams (SSE): unbuffered, heartbeat is 15 s, so the read timeout is far above it.
    location /api/internal/events/ {
        proxy_pass http://qhhoj_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;     # never trust a client-supplied id
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Problem data archive and Polygon package uploads (ARCHIVE_MAX_BYTES / POLYGON_PACKAGE_MAX_BYTES = 512 MiB).
    location ~ ^/api/internal/problems/(imports/?$|[^/]+/data/archive$) {
        client_max_body_size 513m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_pass http://qhhoj_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;     # never trust a client-supplied id
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        include /etc/nginx/snippets/qhhoj-security-headers.conf;
    }

    # Legacy feed urls.
    location ~ ^/feed/(blog|problems)/(rss|atom)/?$ {
        rewrite ^/feed/(blog|problems)/(rss|atom)/?$ /api/internal/feeds/$1/$2 last;
    }
    location ~ ^/feed/comment/(rss|atom)/?$ {
        rewrite ^/feed/comment/(rss|atom)/?$ /api/internal/feeds/comments/$1 last;
    }

    # --- Uploaded media (MEDIA_ROOT, MEDIA_URL=/media) -------------------------
    # User bytes under their language's extension (html, svg, ...): never rendered inline.
    location ^~ /media/submission_file/ {
        alias /srv/qhhoj/media/submission_file/;   # CHANGE: MEDIA_ROOT/submission_file/
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "sandbox" always;
        include /etc/nginx/snippets/qhhoj-security-headers.conf;
    }
    # Allow-listed types only; html, xml, js, md, ... download and never render on the site origin
    # (the legacy upload tree is unaudited). <img src> of an svg still works: a response CSP is ignored by images.
    location /media/ {
        alias /srv/qhhoj/media/;         # CHANGE: MEDIA_ROOT, keep the trailing slash
        expires 1h;                      # materials are overwritten in place
        types {
            image/png png; image/jpeg jpg jpeg; image/gif gif; image/webp webp;
            image/svg+xml svg; application/pdf pdf; text/plain txt;
        }
        default_type application/octet-stream;
        add_header Content-Security-Policy $qhhoj_media_csp always;
        include /etc/nginx/snippets/qhhoj-security-headers.conf;
    }
    # Nothing but MEDIA_ROOT is ever under /media; the data roots are not reachable from the web.
    # Legacy upload paths: statements, posts and comments embed /martor/<file>, problems link /pdf/<file>
    # (statement PDFs) and /materials/<file>, old submissions /submission_file/<file>; the old site served each
    # from MEDIA_ROOT/<dir>/. Served through /media/ so its type allow-list and CSP apply.
    location ~ ^/(martor|pdf|materials|submission_file)/(.*)$ {
        rewrite ^/(martor|pdf|materials|submission_file)/(.*)$ /media/$1/$2 last;
    }

    # --- SPA ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/qhhoj-security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        # Report-Only for the first days, then rename to Content-Security-Policy. The script hash is the inline
        # pre-paint script of index.html: recompute it (sha256, base64) whenever that script changes.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-MHQNXy+fWLihZvjj5KUQKEf4VsT3K5mBQKxtPeoq+rg='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        include /etc/nginx/snippets/qhhoj-security-headers.conf;
        try_files $uri /index.html;
    }
}
