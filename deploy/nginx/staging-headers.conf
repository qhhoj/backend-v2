# /etc/nginx/snippets/qhhoj-staging-headers.conf: the production headers plus noindex, for every staging response.
# qhhoj-staging.conf includes it wherever qhhoj.conf includes qhhoj-security-headers.conf.
include /etc/nginx/snippets/qhhoj-security-headers.conf;
add_header X-Robots-Tag "noindex, nofollow" always;
