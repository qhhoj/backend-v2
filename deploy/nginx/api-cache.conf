# /etc/nginx/conf.d/20-qhhoj-api-cache.conf (http context): feeds `add_header Cache-Control` in qhhoj-security-headers.conf.
# An /api answer without a Cache-Control of its own (a file download at a .zip URL is cached by a CDN on the extension) gets
# "private, no-store"; an answer that has one gets "" and so no second header (add_header does not replace an upstream one).
map "$upstream_http_cache_control:$uri" $qhhoj_api_cache_control {
    default "";
    "~^:/api/" "private, no-store";
}
