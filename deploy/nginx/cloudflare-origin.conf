# /etc/nginx/conf.d/qhhoj-cloudflare-origin.conf (http context): which TCP peers may reach the QHHOJ server blocks.
# Cloudflare's published edge ranges, fetched 2026-10-23 from https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6 (refresh: RUNBOOK "Cloudflare origin gate"). Loopback is allowed for
# qhhoj-deploy's --resolve check and local curls.
# Keys on $realip_remote_addr (the TCP peer): the host's 00-cloudflare-real-ip.conf rewrites $remote_addr to the
# visitor, so $remote_addr cannot tell Cloudflare from a direct hit. Needs the realip module (nginx -V).
geo $realip_remote_addr $qhhoj_via_cloudflare {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    # ips-v4
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    # ips-v6
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# 1 = refuse. Not via Cloudflare, except an ACME http-01 challenge, which the CA may send straight to port 80.
map "$qhhoj_via_cloudflare$uri" $qhhoj_refuse_origin {
    default 0;
    ~^0(?!/\.well-known/acme-challenge/) 1;
}
