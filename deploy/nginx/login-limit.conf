# /etc/nginx/conf.d/10-qhhoj-login-limit.conf (http context): the zone for qhhoj.conf's `location = /api/internal/auth/login`.
# Keyed on $binary_remote_addr, the visitor once the host's 00-cloudflare-real-ip.conf has run. The api also bounds its
# password checks per address (MAX_HASHES_PER_REQUESTER, also 8); this refuses the excess before it reaches the api.
limit_conn_zone $binary_remote_addr zone=qhhoj_login:10m;
