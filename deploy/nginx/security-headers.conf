# HSTS stays at 300 s during the rollback period; raise to 31536000 afterwards (no includeSubDomains: other subdomains unknown).
# Included in every location that sets its own add_header (nginx drops inherited add_header otherwise).
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
