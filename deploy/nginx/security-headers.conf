# HSTS one year now that the rollback period is over; no includeSubDomains (other subdomains unknown), no preload.
# Included in every location that sets its own add_header (nginx drops inherited add_header otherwise).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Needs conf.d/20-qhhoj-api-cache.conf (the map); an empty value adds no header.
add_header Cache-Control $qhhoj_api_cache_control always;
