# deploy/judge/nftables-judge.conf: judge host. Fill the four addresses, then: nft -c -f /etc/nftables.conf
flush ruleset
define BRIDGE = 10.0.0.1          # site host private IP (bridge and NFS)
define BRIDGE_PORT = 9999
define ADMIN_NET = 10.0.0.0/24    # where SSH comes from
define RESOLVER = 10.0.0.53       # DNS
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr $ADMIN_NET tcp dport 22 accept
    icmp type echo-request limit rate 5/second accept
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    ip daddr $BRIDGE tcp dport { $BRIDGE_PORT, 2049 } accept
    ip daddr $RESOLVER udp dport 53 accept
    udp dport 123 accept
    tcp dport { 80, 443 } meta skuid { 0, "_apt" } accept   # apt (root, and its _apt download sandbox user) only
  }
  chain forward { type filter hook forward priority 0; policy drop; }
}
